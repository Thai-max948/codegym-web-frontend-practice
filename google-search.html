<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Tìm kiếm</title>
  <style>
    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    .search-form {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      text-align: center;
    }
    .search-form input[type="text"] {
      width: min(100%, 420px);
      box-sizing: border-box;
      padding: 12px 16px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      font-size: 16px;
    }
    .search-form input[type="submit"] {
      margin-top: 16px;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #f8f9fa;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <form class="search-form" action="https://www.google.com.vn/search" method="GET">
      <h1>Form Tìm kiếm Google</h1>
      <label for="search-query">Nhập từ khóa muốn tìm:</label>
      <p><input type="text" id="search-query" name="q" placeholder="Nhập từ khóa"></p>
      <input type="submit" value="Tìm kiếm">
    </form>
  </main>
</body>
</html>
