<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch họp công ty</title>
  <style>
    body { margin: 32px; font-family: Arial, sans-serif; color: #202124; }
    table { width: 100%; max-width: 820px; border-collapse: collapse; }
    th, td { border: 1px solid #5f6b76; padding: 12px 14px; text-align: left; }
    thead { background: #e8f0fe; }
    th[scope="row"] { background: #f6f8fa; }
  </style>
</head>
<body>
  <h1>Lịch họp công ty</h1>
  <table>
    <thead>
      <tr><th scope="col">Ngày</th><th scope="col">Giờ</th><th scope="col">Nội dung cuộc họp</th></tr>
    </thead>
    <tbody>
      <tr><th scope="rowgroup" rowspan="2">Thứ Hai</th><td>09:00–10:00</td><td>Họp nhóm dự án</td></tr>
      <tr><td>10:30–11:30</td><td>Họp cập nhật tiến độ</td></tr>
      <tr><th scope="row">Thứ Ba</th><td colspan="2">Họp toàn công ty — 14:00–16:00</td></tr>
      <tr><th scope="row">Thứ Tư</th><td>15:00–16:00</td><td>Đánh giá sprint</td></tr>
    </tbody>
  </table>
</body>
</html>
