<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm</title>
  <style>
    body { margin: 32px; font-family: Arial, sans-serif; color: #202124; }
    table { width: 100%; max-width: 760px; border-collapse: collapse; }
    th, td { padding: 12px 14px; border: 1px solid #7a8793; text-align: left; }
    thead { background: #e8f0fe; }
    tbody tr:nth-child(even) { background: #f7f9fc; }
    caption { margin-bottom: 12px; text-align: left; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Danh sách sản phẩm</h1>
  <table>
    <caption>Thông tin sản phẩm hiện có</caption>
    <thead>
      <tr><th scope="col">Tên sản phẩm</th><th scope="col">Giá</th><th scope="col">Số lượng</th></tr>
    </thead>
    <tbody>
      <tr><td>Bàn phím cơ</td><td>1.200.000 ₫</td><td>12</td></tr>
      <tr><td>Chuột không dây</td><td>450.000 ₫</td><td>25</td></tr>
      <tr><td>Màn hình 24 inch</td><td>3.500.000 ₫</td><td>8</td></tr>
      <tr><td>Tai nghe</td><td>850.000 ₫</td><td>17</td></tr>
    </tbody>
  </table>
</body>
</html>
