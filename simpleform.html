<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Form</title>
  <style>
    .wufoo {
      max-width: 560px;
      margin: 32px auto;
      padding: 24px;
      border: 1px solid #d8dee4;
      border-radius: 10px;
      font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
      line-height: 1.6;
    }
    .wufoo h1 { margin-top: 0; }
    .wufoo input[type="text"], .wufoo input[type="email"],
    .wufoo input[type="tel"], .wufoo select {
      box-sizing: border-box;
      max-width: 100%;
      padding: 8px;
      margin: 4px 0 12px;
    }
    .wufoo button { padding: 9px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <form method="get" action="simpleform.html" class="wufoo">
    <h1>Order Form</h1>
    <label for="product">What would you like to buy?</label><br>
    <select id="product" name="product">
      <option value="A">A</option>
      <option value="B">B (+ $0.50)</option>
      <option value="C">C (+ $0.50)</option>
    </select>
    <fieldset>
      <legend>How many would you like to order?</legend>
      <label><input type="radio" name="quantity" value="1" checked> 1 - $10</label><br>
      <label><input type="radio" name="quantity" value="2"> 2 - $20</label><br>
      <label><input type="radio" name="quantity" value="3"> 3 - $25</label>
    </fieldset>
    <p><strong>Name <span style="color: red" aria-label="required">*</span></strong></p>
    <label for="firstname">First name</label><br>
    <input type="text" id="firstname" name="firstname" placeholder="FirstName" size="15" required>
    <label for="lastname">Last name</label><br>
    <input type="text" id="lastname" name="lastname" placeholder="LastName" size="15" required>
    <p><label for="email">Email</label></p>
    <input type="email" id="email" name="email" size="35">
    <p><strong>Phone Number</strong></p>
    <label for="phone1">Area code</label>
    <input type="tel" id="phone1" name="phone1" size="5" inputmode="numeric">
    <span aria-hidden="true">-</span>
    <label for="phone2">Prefix</label>
    <input type="tel" id="phone2" name="phone2" size="5" inputmode="numeric">
    <span aria-hidden="true">-</span>
    <label for="phone3">Line number</label>
    <input type="tel" id="phone3" name="phone3" size="5" inputmode="numeric">
    <p><button type="submit" name="btSubmit">Submit</button></p>
  </form>
</body>
</html>
