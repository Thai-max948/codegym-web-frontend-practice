<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng đơn giản trong HTML</title>
  <style>
    body { margin: 32px; font-family: Arial, sans-serif; color: #202124; }
    table { width: 100%; max-width: 720px; border-collapse: collapse; }
    caption { margin-bottom: 12px; font-size: 1.25rem; font-weight: 700; text-align: left; }
    th, td { border: 1px solid #5f6368; padding: 10px 14px; text-align: left; }
    thead { background: #e8f0fe; }
    tbody tr:nth-child(even) { background: #f8f9fa; }
  </style>
</head>
<body>
  <h1>Danh sách học sinh</h1>
  <table>
    <caption>Thông tin học sinh</caption>
    <thead>
      <tr><th scope="col">Họ và Tên</th><th scope="col">Tuổi</th><th scope="col">Lớp</th></tr>
    </thead>
    <tbody>
      <tr><td>Nguyễn Văn A</td><td>15</td><td>10A1</td></tr>
      <tr><td>Trần Thị B</td><td>16</td><td>11B2</td></tr>
      <tr><td>Lê Văn C</td><td>17</td><td>12C3</td></tr>
    </tbody>
  </table>
</body>
</html>
