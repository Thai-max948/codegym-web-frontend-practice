<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký người dùng</title>
  <style>
    body { margin: 0; padding: 36px 16px; background: #f1f5f9; color: #1e293b; font-family: Arial, sans-serif; }
    form { max-width: 520px; margin: auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 8px 24px #0f172a18; }
    h1 { margin-top: 0; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input[type="text"], input[type="email"], input[type="tel"] {
      box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #94a3b8; border-radius: 6px;
    }
    fieldset { margin-top: 18px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
    fieldset label { display: inline-block; margin: 8px 16px 4px 0; font-weight: 400; }
    button { margin: 18px 8px 0 0; padding: 10px 16px; border: 0; border-radius: 6px; cursor: pointer; }
    button[type="submit"] { background: #2563eb; color: white; }
    button[type="reset"] { background: #e2e8f0; color: #1e293b; }
  </style>
</head>
<body>
  <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
    <h1>Đăng ký người dùng</h1>
    <label for="name">Họ và tên</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="phone">Số điện thoại</label>
    <input type="tel" id="phone" name="phone">
    <fieldset>
      <legend>Giới tính</legend>
      <label><input type="radio" name="gender" value="male" required> Nam</label>
      <label><input type="radio" name="gender" value="female"> Nữ</label>
      <label><input type="radio" name="gender" value="other"> Khác</label>
    </fieldset>
    <button type="submit">Đăng ký</button>
    <button type="reset">Nhập lại</button>
  </form>
</body>
</html>
